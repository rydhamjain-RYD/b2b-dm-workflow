<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2B DM Workflow</title>
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .split { flex: 1; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .split > div { min-height: 0; border-right: 1px solid var(--line); }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; grid-template-rows: 70vh 100vh; } body { height: auto; } }
</style>
</head>
<body>
<div class="topbar">
  <h1>B2B DM Workflow</h1>
  <span class="small muted">Left: buyers messaging the business. Right: the owner approving what the assistant drafts.</span>
  <span class="spacer"></span>
  <a href="/buyer.html" class="small">Buyer only</a>
  <a href="/owner.html" class="small">Owner only</a>
</div>
<div class="split">
  <div><iframe src="/buyer.html" title="Buyer simulator"></iframe></div>
  <div><iframe src="/owner.html" title="Owner dashboard"></iframe></div>
</div>
</body>
</html>
